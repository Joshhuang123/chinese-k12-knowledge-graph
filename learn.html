<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>学习页 · 中小学知识图谱</title>
<meta name="description" content="一个知识点一页：视频、教材原页、教材原话、公式图、前置链、练习。">
<style>
:root{
  --bg:#08090c; --panel:#0f1218; --panel2:#141822; --line:#232a36;
  --fg:#e8ebf2; --muted:#8b93a7; --dim:#5d6577;
  --acc:#ff3d7f; --amber:#ff9f45; --ok:#43d9c0; --blue:#7fd3ff;
  --r:12px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--fg);
  font:15px/1.7 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
  -webkit-font-smoothing:antialiased;
}
a{color:var(--blue);text-decoration:none}
a:hover{text-decoration:underline}
button{font:inherit;cursor:pointer}
code,.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}

/* ── 顶栏 ── */
header{
  position:sticky;top:0;z-index:40;background:rgba(8,9,12,.92);
  backdrop-filter:blur(14px);border-bottom:1px solid var(--line);
}
.hwrap{max-width:1180px;margin:0 auto;padding:10px 20px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.brand{font-weight:700;font-size:16px;letter-spacing:.3px;white-space:nowrap}
.brand span{color:var(--acc)}
/* 「学习页」三个字本身是回主站的链接 —— 学习页原来是个孤儿页，
   站里没有一处链得过来，也没有一处链得回去。 */
.brand a.back{color:inherit;text-decoration:none;border-bottom:1px dashed var(--line)}
.brand a.back:hover{color:var(--acc);border-bottom-color:var(--acc)}
.vtabs{display:flex;gap:6px;background:#11151d;border:1px solid var(--line);border-radius:9px;padding:3px}
.vtab{border:0;background:transparent;color:var(--muted);padding:5px 11px;border-radius:6px;font-size:13px;white-space:nowrap}
.vtab.on{background:var(--acc);color:#fff;font-weight:600}
.hsearch{flex:1;min-width:220px;position:relative}
.hsearch input{
  width:100%;background:#11151d;border:1px solid var(--line);color:var(--fg);
  padding:8px 12px;border-radius:9px;font-size:14px;outline:none;
}
.hsearch input:focus{border-color:#3a4150}
#qres{
  position:absolute;top:42px;left:0;right:0;background:var(--panel2);
  border:1px solid var(--line);border-radius:10px;max-height:56vh;overflow:auto;
  display:none;z-index:50;box-shadow:0 18px 48px rgba(0,0,0,.55)
}
#qres.on{display:block}
.qr{padding:9px 13px;border-bottom:1px solid #1b212b;cursor:pointer;display:flex;gap:10px;align-items:baseline}
.qr:last-child{border-bottom:0}
.qr:hover{background:#1a202b}
.qr b{font-weight:600}
.qr .tag{font-size:11.5px;color:var(--muted);border:1px solid var(--line);border-radius:5px;padding:1px 6px;white-space:nowrap}
.qr em{font-style:normal;color:var(--dim);font-size:12.5px}
.qempty{padding:14px;color:var(--muted);font-size:13.5px}

/* ── 布局 ── */
main{max-width:1180px;margin:0 auto;padding:22px 20px 80px}
.crumb{color:var(--muted);font-size:13px;margin-bottom:14px}
.crumb a{color:var(--muted)}
.crumb b{color:var(--fg);font-weight:600}

.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:20px 22px;margin-bottom:16px}
h1{font-size:28px;line-height:1.25;margin:0 0 10px;letter-spacing:-.4px}
h2{font-size:15px;margin:0 0 12px;color:var(--fg);display:flex;align-items:center;gap:9px}
h2::before{content:"";width:3px;height:15px;border-radius:2px;background:var(--acc)}
h2 .n{color:var(--dim);font-weight:400;font-size:12.5px}

.chips{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:4px}
.chip{font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:2px 8px;white-space:nowrap}
.chip.hi{color:var(--amber);border-color:#4a3a22}
.chip.core{color:var(--acc);border-color:#4b2436}
.chip.good{color:var(--ok);border-color:#22463f}

.def{font-size:16.5px;line-height:1.85;margin:14px 0 4px}
.def .src{color:var(--dim);font-size:12.5px;margin-left:8px}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:860px){.grid2{grid-template-columns:1fr}}

ul.plain{list-style:none;margin:0;padding:0}
ul.plain li{padding:9px 0;border-bottom:1px solid #1b212b;display:flex;gap:11px;align-items:baseline}
ul.plain li:last-child{border-bottom:0}
ul.plain .t{color:var(--dim);font-size:12px;min-width:56px}
ul.plain .b{font-size:14.5px}
ul.plain .b a{color:var(--fg)}
ul.plain .b a:hover{color:var(--blue)}
ul.plain .note{color:var(--dim);font-size:12.5px}

.fml{display:inline-block;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
  background:#151a23;border:1px solid #262d3a;border-radius:6px;padding:3px 9px;margin:3px 5px 3px 0;font-size:13.5px}

.fig{background:#11151d;border:1px solid var(--line);border-radius:9px;padding:11px 13px;margin-bottom:9px}
.fig .cap{font-weight:600;font-size:13.5px;margin-bottom:5px}
.fig .tx{color:var(--muted);font-size:13px;line-height:1.75}

.quote{background:#11151d;border-left:3px solid var(--amber);border-radius:0 8px 8px 0;padding:11px 14px;margin-bottom:9px}
.quote .tx{white-space:pre-wrap;font-size:14px;line-height:1.85}
.quote .meta{color:var(--dim);font-size:12px;margin-top:7px;display:flex;gap:10px;flex-wrap:wrap}

.pageimg{background:#11151d;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.pageimg img{width:100%;display:block}
.pageimg .cap{color:var(--muted);font-size:12.5px;padding:9px 12px;border-top:1px solid var(--line)}
.pageimg .fail{padding:26px;text-align:center;color:var(--dim);font-size:13px}

.quiz{background:#11151d;border:1px solid var(--line);border-radius:9px;padding:14px 16px;margin-bottom:10px}
.quiz .q{font-size:15px;line-height:1.8;margin-bottom:10px}
.quiz .opts{display:grid;gap:7px}
.quiz .opt{
  display:flex;gap:9px;align-items:flex-start;text-align:left;width:100%;
  background:#161b25;border:1px solid #262d3a;color:var(--fg);
  padding:9px 12px;border-radius:8px;font-size:14px;line-height:1.6;
}
.quiz .opt:hover{border-color:#3a4150;background:#1b212c}
.quiz .opt.sel{border-color:var(--blue);background:#152030}
.quiz .opt.right{border-color:var(--ok);background:#10241f}
.quiz .opt.wrong{border-color:var(--acc);background:#24121a}
.quiz .opt b{color:var(--muted);font-weight:600;min-width:14px}
.quiz .fb{margin-top:10px;font-size:13.5px;line-height:1.75;color:var(--muted);
  padding-top:9px;border-top:1px solid #1b212b}
.quiz .fb .ok{color:var(--ok);font-weight:600}
.quiz .fb .no{color:var(--acc);font-weight:600}

.practice{counter-reset:q}
.practice li{margin-bottom:11px;padding-left:26px;position:relative;font-size:14.5px;line-height:1.8}
.practice li::before{counter-increment:q;content:counter(q);position:absolute;left:0;top:2px;
  width:19px;height:19px;border-radius:5px;background:#1b2130;color:var(--muted);
  font-size:11.5px;display:grid;place-items:center;font-family:ui-monospace,monospace}

.vid{background:#11151d;border:1px solid var(--line);border-radius:9px;padding:13px}
.vid iframe{width:100%;aspect-ratio:16/9;border:0;border-radius:7px;background:#000}
.vid a{font-size:13.5px}
.vidnone{color:var(--dim);font-size:13.5px;padding:16px;border:1px dashed var(--line);border-radius:9px;text-align:center}

.empty{color:var(--dim);font-size:13.5px;padding:10px 0}
.toc{display:flex;flex-wrap:wrap;gap:7px}
.toc a{font-size:12.5px;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:3px 9px}
.toc a:hover{color:var(--fg);border-color:#3a4150;text-decoration:none}
/* 「按教材翻」：册次选中态 + 章节分组 */
.toc a.on{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
.bstage{margin:10px 0 0}
.bstage b{display:block;font-size:12px;color:var(--dim);font-weight:600;margin-bottom:6px}
.bstage.other{margin-top:14px;padding-top:12px;border-top:1px dashed var(--line)}
.bstage.other b{display:inline;margin-right:8px}
.bstage.other span{font-size:11.5px;color:var(--dim)}
.bchapwrap{margin-top:16px}
.bchap{margin:0 0 14px;padding:0 0 12px;border-bottom:1px dashed var(--line)}
.bchap:last-child{border-bottom:0}
.bchap h3{margin:0 0 8px;font-size:13.5px;color:var(--fg);font-weight:600;display:flex;align-items:baseline;gap:8px}
.bchap h3 span{font-size:11.5px;color:var(--dim);font-weight:400}

footer{max-width:1180px;margin:0 auto;padding:0 20px 50px;color:var(--dim);font-size:12.5px;line-height:1.9}
footer a{color:var(--muted)}

@media(max-width:640px){
  h1{font-size:23px}
  .card{padding:16px}
  .hwrap{padding:9px 14px}
  main{padding:16px 14px 60px}
}
</style>
</head>
<body>

<header>
  <div class="hwrap">
    <div class="brand"><a href="./" class="back" title="回到图谱">学习页</a><span>·</span>知识图谱</div>
    <div class="vtabs" id="vtabs"></div>
    <div class="hsearch">
      <input id="q" type="search" placeholder="搜知识点（支持拼音首字母、别称）" autocomplete="off">
      <div id="qres"></div>
    </div>
  </div>
</header>

<main id="main">
  <div class="card">
    <h2>加载中<span class="n">数据文件…</span></h2>
    <div class="empty">正在载入学习数据。</div>
  </div>
</main>

<footer id="foot"></footer>

<script>
/* ============================================================================
 * 学习页 —— 一个知识点一页
 *
 * 设计约束（跟主站一致）：
 *   · **不加载外部资源**（除了教材原页图和视频，那是内容本身）
 *   · 数据按版本分文件，用 <script> 动态加载 —— fetch 读本地 json
 *     在 file:// 下会被 CORS 挡掉，script 标签不受限
 *   · 教材原页图的页码是**扫描序号**；位置文字里的「第 N 页」是**印刷页码**，
 *     两套页码，别混
 * ==========================================================================*/

const $ = s => document.querySelector(s);
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const VERSIONS = [
  {id:'sh',  label:'沪教版 / 沪科版', file:'data/learn-sh.js',  site:'shanghai.html',
   desc:'上海的孩子按沪教版教材学'},
  {id:'rjb', label:'人教版 · 初中高中', file:'data/learn-rjb.js', site:'index.html',
   desc:'全国通用的初中高中'},
  {id:'kx',  label:'小学科学',        file:'data/learn-kx.js',  site:'kx.html',
   desc:'人教版《小学科学》1上~6下'},
];

let DATA = null;          // 当前版本的数据
let PAGES = null;         // 教材页图基址（沪教版，平台外链）
let PAGE_IMAGES_RJB = null;  // 人教版/小学科学页图（本地 PDF 渲染，入库）
let PAGE_OFFSETS = {};     // 人教版：教材册次 → 印刷页码偏移（扫描页 + offset = 书上印的页码）
let PAGE_OFFSETS_SH = {};  // 沪教版：沪教书号 → 印刷页码偏移
let VIDEOS = null;        // 视频索引
let QUESTIONS = [];       // 练习题
const QUIZ_BY_IDX = {};    // 题（渲染期ID:题号 → 题），每次渲染用新的 RENDER_ID
let RENDER_ID = 0;        // 每次 render() 递增，避免不同页面的题号串了
let CURRENT = 'sh';

/* ── 载入 ───────────────────────────────────────────────── */
function loadScript(src){
  return new Promise((res, rej)=>{
    const s = document.createElement('script');
    s.src = src;
    s.onload = res;
    s.onerror = ()=>rej(new Error('加载失败: '+src));
    document.head.appendChild(s);
  });
}

async function ensureData(v){
  if (DATA && DATA.version === v) return;
  const meta = VERSIONS.find(x=>x.id===v) || VERSIONS[0];
  await loadScript(meta.file);
  DATA = window.LEARN_DATA;
}

/* ── 路由 ───────────────────────────────────────────────── */
function params(){
  const u = new URLSearchParams(location.search);
  return {v: u.get('v')||CURRENT, c: u.get('c')};
}

function go(qs){
  const u = new URLSearchParams(location.search);
  for (const k of ['v','c']) u.delete(k);
  for (const [k,val] of Object.entries(qs)) if (val!=null) u.set(k,val);
  history.pushState(null,'','?'+u.toString());
  render();
}

window.addEventListener('popstate', ()=>render());

/* ── 搜索索引 ───────────────────────────────────────────── */
let INDEX = [];          // [{i, n, g, b, key}]
let INDEX_BY_NAME = new Map();

function buildIndex(){
  INDEX = DATA.nodes.map(n=>({i:n.i, n:n.n, g:n.g, b:n.b, key:norm(n.n)}));
  INDEX_BY_NAME = new Map();
  for (const x of INDEX){
    const k = x.key;
    if (!INDEX_BY_NAME.has(k)) INDEX_BY_NAME.set(k, x);
  }
}

/** 归一化：去括号、去空白 —— 「三角形的性质（三个）」→「三角形的性质」 */
function norm(s){
  return String(s||'').replace(/[（(].*?[）)]/g,'').replace(/\s+/g,'').toLowerCase();
}

/** 拼音首字母：中文取每字拼音首字母（ASCII 字母/数字保留） */
function initials(s){
  // 没有拼音表时退化成「首字 + 长度」，够用来区分同名
  return String(s||'').replace(/\s+/g,'').slice(0,2);
}

function search(q){
  const raw = String(q||'').trim();
  if (!raw) return [];
  const nq = norm(raw);
  const ni = initials(raw).toLowerCase();
  const out = [];
  for (const x of INDEX){
    const k = x.key;
    let score = 0;
    if (k === nq) score = 100;
    else if (k.startsWith(nq)) score = 80;
    else if (k.includes(nq)) score = 60;
    else if (ni && k.slice(0,ni.length) === ni) score = 40;
    if (score){
      out.push({x, score});
      if (out.length > 400) break;
    }
  }
  out.sort((a,b)=> b.score - a.score || a.x.g - b.x.g);
  return out.slice(0,30).map(o=>o.x);
}

/* ── 搜索框 ─────────────────────────────────────────────── */
const qEl = $('#q'), qres = $('#qres');
let qTimer = null;

function showResults(list, q){
  if (!list.length){
    qres.innerHTML = '<div class="qempty">没有找到「'+esc(q)+'」。换个说法试试，或者只搜两个字。</div>';
    qres.classList.add('on');
    return;
  }
  qres.innerHTML = list.map(x =>
    `<div class="qr" data-i="${x.i}"><b>${esc(x.n)}</b><span class="tag">${esc(x.g||'')}年级</span><em>${esc(x.b||'')}</em></div>`
  ).join('');
  qres.classList.add('on');
}

qEl.addEventListener('input', ()=>{
  clearTimeout(qTimer);
  qTimer = setTimeout(()=>{
    const list = search(qEl.value);
    if (qEl.value.trim()) showResults(list, qEl.value);
    else qres.classList.remove('on');
  }, 130);
});
qEl.addEventListener('focus', ()=>{ if (qEl.value.trim()) showResults(search(qEl.value), qEl.value); });
document.addEventListener('click', e=>{
  if (!e.target.closest('.hsearch')) qres.classList.remove('on');
  const row = e.target.closest('.qr');
  if (row){ qres.classList.remove('on'); go({v:CURRENT, c:row.dataset.i}); }
});
qEl.addEventListener('keydown', e=>{
  if (e.key === 'Enter'){
    const list = search(qEl.value);
    if (list.length){ qres.classList.remove('on'); go({v:CURRENT, c:list[0].i}); }
  } else if (e.key === 'Escape'){ qres.classList.remove('on'); }
});

/* ── 版本切换 ───────────────────────────────────────────── */
function buildTabs(){
  $('#vtabs').innerHTML = VERSIONS.map(v =>
    `<button class="vtab${v.id===CURRENT?' on':''}" data-v="${v.id}">${esc(v.label)}</button>`
  ).join('');
}
$('#vtabs').addEventListener('click', e=>{
  const b = e.target.closest('.vtab');
  if (!b) return;
  const v = b.dataset.v;
  CURRENT = v;
  buildTabs();
  go({v:v, c:null});
});

/* ── 教材页图 ───────────────────────────────────────────── */
function pageImgUrl(bookId, scanPage, pdfBook){
  /* 两种教材原页来源：
   *  · **沪教版/沪科版** → 平台的官方扫描页图（外链，不占仓库）
   *     PAGE_IMAGES[bookId].base + '/' + 扫描页码 + '.jpg'
   *  · **人教版/小学科学** → 从本地 PDF 渲染的页图（入库）
   *     PAGE_IMAGES_RJB[pdfBook][扫描页码] = 'data/pages/…/N.webp'
   *     页码就是本地 PDF 的扫描页 —— **天然对齐**（见 src/render_page_images.py）
   */
  if (pdfBook && PAGE_IMAGES_RJB && PAGE_IMAGES_RJB[pdfBook]) {
    const f = PAGE_IMAGES_RJB[pdfBook][String(scanPage)];
    if (f) return f;
  }
  if (PAGES && PAGES[bookId] && scanPage) {
    return PAGES[bookId].base + '/' + scanPage + '.jpg';
  }
  return null;
}

/* ── 渲染 ───────────────────────────────────────────────── */
async function render(){
  RENDER_ID++;
  const p = params();
  CURRENT = VERSIONS.some(x=>x.id===p.v) ? p.v : 'sh';
  buildTabs();
  await ensureData(CURRENT);
  if (!PAGES){
    // 用 <script> 而不是 fetch —— fetch 读本地 json 在 file:// 下被 CORS 挡掉
    try{ await loadScript('data/page-images.js'); PAGES = window.PAGE_IMAGES || {}; }
    catch(e){ PAGES = {}; }
  }
  // ⚠️ 三份索引**各自独立**加载 ——
  // 原来全塞在 `if (!PAGE_IMAGES_RJB)` 里，结果只要页图索引先加载了，
  // 偏移量就永远加载不上（首页和第一次进页面时顺序不保证）。
  if (!PAGE_IMAGES_RJB){
    try{ await loadScript('data/page-images-rjb.js'); PAGE_IMAGES_RJB = window.PAGE_IMAGES_RJB || {}; }
    catch(e){ PAGE_IMAGES_RJB = {}; }
  }
  if (!PAGE_OFFSETS || !Object.keys(PAGE_OFFSETS).length){
    try{ await loadScript('data/page-offsets.js'); PAGE_OFFSETS = window.PAGE_OFFSETS || {}; }
    catch(e){ PAGE_OFFSETS = {}; }
  }
  if (!PAGE_OFFSETS_SH || !Object.keys(PAGE_OFFSETS_SH).length){
    try{ await loadScript('data/page-offsets-sh.js'); PAGE_OFFSETS_SH = window.PAGE_OFFSETS_SH || {}; }
    catch(e){ PAGE_OFFSETS_SH = {}; }
  }
  buildIndex();
  const main = $('#main');
  if (p.c == null){
    main.innerHTML = homeHTML();
    $('#foot').innerHTML = footHTML();
    return;
  }
  const n = DATA.nodes.find(x=>String(x.i)===String(p.c));
  if (!n){ main.innerHTML = '<div class="card"><div class="empty">找不到这个知识点。</div></div>'; return; }
  main.innerHTML = nodeHTML(n);
  window.scrollTo(0,0);
  $('#foot').innerHTML = footHTML();
}

function homeHTML(){
  const v = VERSIONS.find(x=>x.id===CURRENT);
  const byG = new Map();
  for (const n of DATA.nodes){
    const g = n.g||0;
    if (!byG.has(g)) byG.set(g, []);
    byG.get(g).push(n);
  }
  const gs = [...byG.keys()].sort((a,b)=>a-b);
  const total = DATA.nodes.length;
  const withRead = DATA.nodes.filter(n=>n.rd && n.rd.length).length;
  const withFormula = DATA.nodes.filter(n=>n.f && n.f.length).length;
  const withPr = DATA.nodes.filter(n=>n.pre && n.pre.length).length;
  return `
  <div class="card">
    <h1>一个知识点，一页</h1>
    <div class="def">${esc(v.desc)}。每个知识点一页，把<b>看懂</b>（讲解视频 · 教材原页 · 教材原话 · 公式图）和<b>会做</b>（教材例题）放在一起，
    再给出它的<b>前置链</b> —— 往前追，就能看出卡在哪一环。</div>
    <div class="chips">
      <span class="chip">${total.toLocaleString()} 个知识点</span>
      <span class="chip">${withRead.toLocaleString()} 个有教材原话</span>
      <span class="chip">${withFormula.toLocaleString()} 个有公式</span>
      <span class="chip">${withPr.toLocaleString()} 个有前置</span>
    </div>
    <div class="empty" style="margin-top:12px">在上面的搜索框里搜一个知识点，或者从下面按教材翻、按年级进。</div>
  </div>
  ${browseHTML()}
  <div class="card">
    <h2>按年级进<span class="n">${gs.length} 个年级层</span></h2>
    <div class="toc">
      ${gs.map(g=>`<a href="#" data-g="${g}">${g===0?'基础':g+' 年级'}（${byG.get(g).length}）</a>`).join('')}
    </div>
  </div>`;
}

/* ── 按教材浏览 ─────────────────────────────────────────────
 *
 * 为什么要有这个：原来首页只有「按年级进」，点进去是几百个概念的平铺列表 ——
 * 对学生等于没有导航。而**学习页本来是孤儿页**，站里没有一处链得过来。
 *
 * 三个版本的「册次 / 章节」口径完全不一样，得各自归一：
 *   沪教版    b = "沪教版·七下"           章 = loc.sec[0].cn（教材目录的章名）
 *   人教版    b = "七下·概念" / "七下·技能" 章 = loc.unit（教材的单元名）
 *   小学科学  b = "一上·我们的感觉器官 › 我们怎样知道" → 用 › 拆成册次 + 章
 *
 * ⚠️ **册次里混着「不是教材的东西」** —— 能力底座、自建概念、教材缺口。
 * 它们也是图谱里的节点，但**不是教材的某一册**，混在教材册次里会让人以为
 * 「能力底座」是一本教材。所以按名字分成两堆，非教材的另起一个区块。
 */
function bookOf(n){
  const b = String(n.b||'');
  if (DATA.version==='kx'){
    const p = b.split('›');
    return {book:(p[0]||'').trim(), chap:(p[1]||'').trim()};
  }
  if (DATA.version==='rjb'){
    const m = b.match(/^(.+?)·(概念|技能|习题|练习|实验)?$/);
    return {book: m ? m[1] : b, chap:''};
  }
  return {book:b, chap:''};
}

/** 这个「册次」是不是真的教材册次？ */
function isRealBook(name, g){
  if (DATA.version==='rjb')
    return /^([一二三四五六七八九]上|[一二三四五六七八九]下|必修[一二三]|选必[一二三])$/.test(name);
  if (DATA.version==='kx')
    return /^([一二三四五六]上|[一二三四五六]下)$/.test(name);
  return /^(沪教版|沪科版)·/.test(name);
}

/** 学段分组：小学 / 初中 / 高中 */
function stageOf(g){
  if (!g) return '其他';
  if (g<=6) return '小学';
  if (g<=9) return '初中';
  return '高中';
}

function chapterOf(n){
  const loc = n.loc||{};
  if (DATA.version==='rjb') return loc.unit||'';
  if (DATA.version==='kx') return bookOf(n).chap;
  const secs = loc.sec||[];
  return (secs[0] && secs[0].cn) || '';
}

let BROWSE_BOOK = null;      // 当前展开的册次

function browseHTML(){
  const books = new Map();      // 册次 → {g, chapters: Map(章 → 节点[]), n}
  for (const n of DATA.nodes){
    const {book} = bookOf(n);
    if (!book) continue;
    if (!books.has(book)) books.set(book, {g:n.g||0, chapters:new Map(), n:0});
    const B = books.get(book);
    const ch = chapterOf(n) || '其他';
    if (!B.chapters.has(ch)) B.chapters.set(ch, []);
    B.chapters.get(ch).push(n);
    B.n++;
  }
  // 真教材 / 非教材分开
  const real = [], other = [];
  for (const [bk,B] of books) (isRealBook(bk,B.g) ? real : other).push([bk,B]);
  const byStage = (a,b)=> (a[1].g-b[1].g) || a[0].localeCompare(b[0],'zh');
  real.sort(byStage); other.sort((a,b)=> b[1].n-a[1].n);

  // 默认展开：**第一本真教材**（原来默认选中的是「能力底座」或「教材缺口」——
  // 一进来看到的是数据的边角料，不是教材）
  if (!BROWSE_BOOK || !books.has(BROWSE_BOOK))
    BROWSE_BOOK = real.length ? real[0][0] : (other.length ? other[0][0] : null);

  const chip = ([bk,B])=>`<a href="#" data-bk="${esc(bk)}" class="${bk===BROWSE_BOOK?'on':''}">${esc(bk)}（${B.n}）</a>`;

  // 真教材按学段分组显示
  let toc = '';
  const stages = ['小学','初中','高中','其他'];
  for (const st of stages){
    const rows = real.filter(([bk,B])=>stageOf(B.g)===st);
    if (!rows.length) continue;
    toc += `<div class="bstage"><b>${st}</b><div class="toc">${rows.map(chip).join('')}</div></div>`;
  }
  if (other.length){
    toc += `<div class="bstage other"><b>不是教材册次</b><span>图谱层面的东西（能力底座 / 自建概念 / 教材缺口），不是某一本书的一册</span>`
        + `<div class="toc">${other.map(chip).join('')}</div></div>`;
  }

  let detail = '';
  if (BROWSE_BOOK && books.has(BROWSE_BOOK)){
    const B = books.get(BROWSE_BOOK);
    // 「其他」放最后 —— 它是没归到章里的节点，不是一章
    const chs = [...B.chapters.entries()].sort((a,b)=>
      (a[0]==='其他')-(b[0]==='其他') || b[1].length-a[1].length);
    detail = chs.map(([ch,nodes])=>{
      const sorted = [...nodes].sort((a,b)=>(b.c||0)-(a.c||0));   // 依赖度高的排前面
      return `<div class="bchap"><h3>${esc(ch)}<span>${nodes.length}</span></h3>
        <div class="toc">${sorted.map(x=>`<a href="#" data-c="${x.i}">${esc(x.n)}</a>`).join('')}</div></div>`;
    }).join('');
  }

  return `<div class="card">
    <h2>按教材翻<span class="n">${real.length} 册教材${other.length?` · ${other.length} 个非册次`:''}</span></h2>
    ${toc}
    <div class="bchapwrap">${detail}</div>
  </div>`;
}

function nodeHTML(n){
  const loc = n.loc || {};
  const chips = [];
  if (n.b) chips.push(`<span class="chip">${esc(n.b)}</span>`);
  if (n.g) chips.push(`<span class="chip">${esc(n.g)} 年级</span>`);
  if (n.core) chips.push(`<span class="chip core">9–10 岁核心</span>`);
  if (n.src && n.src !== '—') chips.push(`<span class="chip">来源 ${esc(n.src)}</span>`);

  // 教材位置
  const secs = (loc.sec||[]).filter(s=>s.cn||s.sn);
  let locHTML = '';
  if (secs.length){
    locHTML = `<div class="card"><h2>教材位置</h2><ul class="plain">` +
      secs.map(s=>`<li><span class="t">${esc(s.c||'')}</span><span class="b">${esc(s.cn||'')} ${esc(s.s||'')} ${esc(s.sn||'')}</span></li>`).join('') +
      `</ul></div>`;
  }

  // 教材原页图
  let imgHTML = '';
  const scan = (loc.scan||[]);
  // ⚠️ 门禁必须是 `(loc.bk || loc.pdfBook)` ——
  // 沪教用 `loc.bk`（沪教书号），人教/小学科学用 `loc.pdfBook`（教材册次码），
  // **人教版的 loc.bk 是空串**。原来只判 `loc.bk`，
  // 于是人教版 1,878 个有页图的节点**一张图都渲染不出来**，
  // 而测试全绿 —— 因为浏览器测试只测了 `?v=sh`。
  if ((loc.bk || loc.pdfBook) && scan.length){
    const u = pageImgUrl(loc.bk, scan[0], loc.pdfBook);
    if (u){
      // 印刷页码 = 扫描页 + 每册偏移（封面/目录页数不同）
      //
      // ⚠️ **三套页码来源**，别混：
      //   人教版  loc.pdfBook → PAGE_OFFSETS（本地 PDF 页脚取页码，31/31 册）
      //   沪教版  loc.bk      → PAGE_OFFSETS_SH（平台 OCR 页脚行，44/67 册）
      //   没有偏移的册次 → **不猜**，老老实实写「电子教材扫描页 N」
      //
      // 写错的后果很具体：沪教版七下数学，面板写「第 16 页」，
      // 图上页脚印的是 **9** —— 学生按 16 翻书翻到的是下一节。
      const off = loc.pdfBook ? (PAGE_OFFSETS[loc.pdfBook] || 0)
                 : (PAGE_OFFSETS_SH[loc.bk] || 0);
      const printed = off ? scan[0] + off : null;
      const pageLabel = printed ? `第 ${printed} 页`
                    : `电子教材扫描页 ${scan[0]}`;
      const extra = printed ? `（${loc.pdfBook ? 'PDF' : '电子教材'} 第 ${scan[0]} 页）` : '';
      imgHTML = `<div class="card"><h2>教材原页<span class="n">${esc(loc.ed||'')}·${esc(loc.vol||'')} ${pageLabel}</span></h2>
        <div class="pageimg">
          <!-- ⚠️ **referrerpolicy="no-referrer" 是必须的** ——
               教材平台的 CDN 有**防盗链**：带外部 Referer 的请求直接 403，
               而且返回的是 **text/html 错误页**（不是图片）——
               Chrome 的 ORB 机制会把这种响应拦掉，页面上的图就变成空白。
               实测：不带 Referer → 200 image/jpeg；带 Referer → 403 text/html。
               本地 file:// 打开时本来就不发 Referer，所以本地看着好好的，
               线上必坏 —— 这个坑查了半天才定位到。 -->
          <img src="${esc(u)}" alt="${esc(n.n)} 在教材${pageLabel}" loading="lazy"
               referrerpolicy="no-referrer"
               onerror="this.outerHTML='<div class=\\'fail\\'>这一页的原图暂时取不到（教材平台的图片需要联网）。<br>可以按上面的「${pageLabel}」去翻书。</div>'">
          <div class="cap">${esc(loc.ed||'')}·${esc(loc.vol||'')} ${pageLabel}${extra}${loc.pdfBook?'（本地教材原书）':'（国家中小学智慧教育平台电子教材）'}</div>
        </div></div>`;
    }
  }

  // 教材原话
  let readHTML = '';
  if (n.rd && n.rd.length){
    readHTML = `<div class="card"><h2>教材原话<span class="n">${n.rd.length} 段</span></h2>` +
      n.rd.map(r=>`<div class="quote"><div class="tx">${esc(r.t)}</div>
        <div class="meta"><span>${esc(r.b||'')}</span>${r.p?`<span>第 ${esc(r.p)} 页</span>`:''}${r.def?'<span style="color:var(--amber)">定义句</span>':''}</div></div>`).join('') +
      `</div>`;
  }

  // 公式
  let fmlHTML = '';
  if (n.f && n.f.length){
    fmlHTML = `<div class="card"><h2>公式<span class="n">教材原书上的</span></h2><div>${n.f.map(f=>`<span class="fml">${esc(f)}</span>`).join('')}</div></div>`;
  }

  // 图
  let figHTML = '';
  if (n.fg && n.fg.length){
    figHTML = `<div class="card"><h2>图<span class="n">教材原书上的</span></h2>` +
      n.fg.map(g=>`<div class="fig"><div class="cap">${esc(g.c||'（无标题）')}</div><div class="tx">${esc(g.t)}</div></div>`).join('') +
      `</div>`;
  }

  // 视频 —— **运行时合并**索引，
  // 这样用户加一个视频只要改 data/learn-videos.json，不用重建数据层。
  // 键可以是概念 id，也可以是概念名（两种都试）。
  let vidHTML = '';
  const vHit = VIDEOS && Object.keys(VIDEOS).filter(k=>!k.startsWith('_')).length
    ? (VIDEOS[n.id] || VIDEOS[norm(n.n)]) : null;
  const vv = vHit || n.v;
  if (vv && (vv.url || vv.bv || vv.yt || vv.id)){
    const src = vv.bv ? 'https://player.bilibili.com/player.html?bvid='+vv.bv+'&page=1'
             : vv.yt ? 'https://www.youtube.com/embed/'+vv.yt
             : vv.url;
    vidHTML = `<div class="card"><h2>讲解视频</h2><div class="vid"><iframe src="${esc(src)}" allowfullscreen loading="lazy"></iframe>
      <p style="margin:10px 0 0"><a href="${esc(vv.url || (vv.bv ? 'https://www.bilibili.com/video/'+vv.bv : vv.yt ? 'https://www.youtube.com/watch?v='+vv.yt : src))}"
         target="_blank" rel="noopener">在原平台打开</a>
         ${vv.title?` · ${esc(vv.title)}`:''}${vv.dur?` · ${esc(vv.dur)}`:''}</p></div></div>`;
  } else {
    vidHTML = `<div class="card"><h2>讲解视频</h2><div class="vidnone">这个知识点还没有讲解视频。<br>
      <span style="color:var(--dim)">视频按知识点挂载，索引在 <code>data/learn-videos.json</code>。</span></div></div>`;
  }

  // 练习：① 自动判分的题 ② 教材例题原文
  let pracHTML = '';
  const myQs = QUESTIONS.filter(q=>q.concept===n.n && q.edition===DATA.version);
  // 题号 → 题。**必须是每次渲染独立的** ——
  // 用全局索引的话，翻到下一个知识点就会读到上一个的题。
  myQs.forEach((q,i)=>{ QUIZ_BY_IDX[RENDER_ID + ':' + i] = q; });
  if (myQs.length){
    pracHTML = `<div class="card"><h2>练一练<span class="n">${myQs.length} 道 · 答完看解析</span></h2>` +
      myQs.map((q,qi)=>quizHTML(q, qi)).join('') + `</div>`;
  }
  if (n.pr && n.pr.length){
    pracHTML += `<div class="card"><h2>教材例题<span class="n">题干原文</span></h2>
      <ol class="practice">${n.pr.map(p=>`<li>${esc(p)}</li>`).join('')}</ol>
      <div class="empty">题干来自教材原书，答案请回教材对。带「思考/探究」的题没有唯一答案。</div></div>`;
  }

  // 前置 / 后继
  const link = (arr, label) => {
    if (!arr || !arr.length) return '';
    return `<div class="card"><h2>${label}<span class="n">${arr.length} 个</span></h2><ul class="plain">` +
      arr.map(([i,nm])=>`<li><span class="b"><a href="#" data-c="${i}">${esc(nm)}</a></span></li>`).join('') +
      `</ul></div>`;
  };

  return `
  <div class="crumb"><a href="#" data-home="1">${esc(DATA.label)}</a> · <b>${esc(n.n)}</b></div>
  <div class="card">
    <h1>${esc(n.n)}</h1>
    <div class="chips">${chips.join('')}</div>
    ${n.d?`<div class="def">${esc(n.d)}<span class="src">图谱定义</span></div>`:''}
  </div>
  ${vidHTML}
  ${imgHTML}
  ${readHTML}
  ${fmlHTML}
  ${figHTML}
  ${pracHTML}
  ${locHTML}
  ${link(n.pre,'前置 —— 学它之前要先会')}
  ${link(n.suc,'后继 —— 会了它接着学')}`;
}

function quizHTML(q, qi){
  const opts = q.options || [];
  return `<div class="quiz" data-qi="${RENDER_ID}:${qi}">
    <div class="q">${esc(q.stem)}</div>
    <div class="opts">${opts.map((o,i)=>
      `<button class="opt" data-i="${i}"><b>${'ABCD'[i]}</b><span>${esc(o)}</span></button>`).join('')}</div>
    <div class="fb" hidden></div>
  </div>`;
}

/* 判分：点选项 → 立刻判对错 + 出解析 */
document.addEventListener('click', e=>{
  const btn = e.target.closest('.quiz .opt');
  if (!btn) return;
  const box = btn.closest('.quiz');
  if (box.dataset.done) return;                 // 已经判过就不再改
  const Q = QUIZ_BY_IDX[box.dataset.qi];
  if (!Q) return;
  box.dataset.done = '1';
  const pick = btn.dataset.i;
  const right = 'ABCD'.indexOf(Q.answer);
  [...box.querySelectorAll('.opt')].forEach((b,i)=>{
    // classList.add('') 会抛 DOMException（空 token 不合法）——
    // 之前就是这里抛的，导致解析框根本不显示。
    if (i === right) b.classList.add('right');
    else if (i === Number(pick)) b.classList.add('wrong');
  });
  const fb = box.querySelector('.fb');
  fb.hidden = false;
  const ok = pick===String(right);
  fb.innerHTML = (ok?'<span class="ok">✓ 对了。</span> ':'<span class="no">✗ 不对。</span> ') +
    esc(Q.explanation || '') +
    (Q.from ? `<span style="color:var(--dim)">　（来源：${esc(Q.from)}）</span>` : '');
});

function footHTML(){
  const v = VERSIONS.find(x=>x.id===CURRENT);
  return `数据来自本项目的 K12 知识图谱（教材原文、页图、公式图、例题都取自教材原书）。<br>
  视频按知识点挂载，索引在 <code>data/learn-videos.json</code>。题库与诊断在后续版本。<br>
  <a href="${v.site}">回${esc(v.label)}图谱站 →</a> ·
  <a href="data.html">数据一览 →</a> ·
  <a href="https://github.com/Joshhuang123/chinese-k12-knowledge-graph">仓库 →</a>`;
}

/* 站内跳转（事件委托） */
document.addEventListener('click', e=>{
  const a = e.target.closest('[data-c]');
  if (a){ e.preventDefault(); go({v:CURRENT, c:a.dataset.c}); return; }
  const g = e.target.closest('[data-g]');
  if (g){
    e.preventDefault();
    const grade = Number(g.dataset.g);
    const list = DATA.nodes.filter(n=>String(n.g)===String(grade));
    // 同年级里挑被依赖度最高的（cen）先看 —— 那是最该先学的
    list.sort((a,b)=> (b.c||0)-(a.c||0));
    if (list.length) go({v:CURRENT, c:list[0].i});
    return;
  }
  const bk = e.target.closest('[data-bk]');
  if (bk){
    e.preventDefault();
    BROWSE_BOOK = bk.dataset.bk;
    render();
    return;
  }
  if (e.target.closest('[data-home]')){ e.preventDefault(); go({v:CURRENT, c:null}); }
});

/* ── 启动 ───────────────────────────────────────────────── */
(async function boot(){
  const p = params();
  CURRENT = VERSIONS.some(x=>x.id===p.v) ? p.v : 'sh';
  buildTabs();
  await ensureData(CURRENT);
  try{ await loadScript('data/page-images.js'); PAGES = window.PAGE_IMAGES || {}; }
  catch(e){ PAGES = {}; }
  try{ await loadScript('data/page-images-rjb.js'); PAGE_IMAGES_RJB = window.PAGE_IMAGES_RJB || {}; }
  catch(e){ PAGE_IMAGES_RJB = {}; }
  try{ await loadScript('data/page-offsets.js'); PAGE_OFFSETS = window.PAGE_OFFSETS || {}; }
  catch(e){ PAGE_OFFSETS = {}; }
  try{ await loadScript('data/page-offsets-sh.js'); PAGE_OFFSETS_SH = window.PAGE_OFFSETS_SH || {}; }
  catch(e){ PAGE_OFFSETS_SH = {}; }
  try{ await loadScript('data/learn-videos.js'); VIDEOS = window.LEARN_VIDEOS || {}; }
  catch(e){ VIDEOS = {}; }
  try{ await loadScript('data/learn-questions.js'); QUESTIONS = window.LEARN_QUESTIONS || []; }
  catch(e){ QUESTIONS = []; }
  buildIndex();
  render();
})();
</script>
